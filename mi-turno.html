  <script src="js/shell-header-es.min.js?v=1795688540" defer></script><main id="main" tabindex="-1">
    <section class="content mi-turno-page">
      <div class="container">
        <div class="mi-turno-layout">
          <p class="mi-turno-eyebrow">Gestión de turnos</p>
          <h1>Consultar o anular tu turno</h1>
          <p class="mi-turno-lead">Ingresá el apellido del paciente, el email con el que reservaste y el código que llegó en la confirmación.</p>

          <form id="mi-turno-form" class="mi-turno-form" novalidate>
            <div class="mi-turno-field">
              <label for="mt-apellido">Apellido</label>
              <input id="mt-apellido" name="apellido" type="text" autocomplete="family-name" maxlength="80" required placeholder="Ej: Pérez" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-email">Email</label>
              <input id="mt-email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="Ej: juan@ejemplo.com" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-codigo">Código de gestión <span class="mi-turno-field-note">Está en el mail de confirmación que recibiste.</span></label>
              <input id="mt-codigo" name="codigo" type="text" autocomplete="one-time-code" maxlength="12" required placeholder="Ej: AB3K7MP" spellcheck="false" autocapitalize="characters" />
            </div>
            <button type="submit" class="mi-turno-btn" id="mt-submit">Buscar turno</button>
          </form>

          <p class="mi-turno-hint">El código está en el mail de confirmación de la reserva. Si no lo tenés, también podés gestionar el turno por WhatsApp con Clara.</p>
          <div id="mt-status" class="mi-turno-status" role="status" aria-live="polite" hidden></div>
          <div id="mt-result" class="mi-turno-result" hidden></div>
        </div>
      </div>
    </section>
  </main>
