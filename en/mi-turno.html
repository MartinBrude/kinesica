    <div id="site-header-root" data-header-lang="en"></div>
  <script src="../js/shell-header-en.min.js?v=1795818696" defer></script><main id="main" tabindex="-1">
    <section class="content mi-turno-page">
      <div class="container">
        <div class="mi-turno-layout">
          <p class="mi-turno-eyebrow">Appointment management</p>
          <h1>View or cancel your appointment</h1>
          <p class="mi-turno-lead">Enter the patient’s last name, the email used to book, and the code from your confirmation email.</p>

          <form id="mi-turno-form" class="mi-turno-form" novalidate>
            <div class="mi-turno-field">
              <label for="mt-apellido">Last name</label>
              <input id="mt-apellido" name="apellido" type="text" autocomplete="family-name" maxlength="80" required placeholder="e.g. Pérez" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-email">Email</label>
              <input id="mt-email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="e.g. juan@example.com" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-codigo">Management code <span class="mi-turno-field-note">It’s in the confirmation email you received.</span></label>
              <input id="mt-codigo" name="codigo" type="text" autocomplete="one-time-code" maxlength="12" required placeholder="e.g. AB3K7MP" spellcheck="false" autocapitalize="characters" />
            </div>
            <button type="submit" class="mi-turno-btn" id="mt-submit">Find appointment</button>
          </form>

          <p class="mi-turno-hint">The code is in your booking confirmation email. You can also manage the appointment with Clara on WhatsApp.</p>
          <div id="mt-status" class="mi-turno-status" role="status" aria-live="polite" hidden></div>
          <div id="mt-result" class="mi-turno-result" hidden></div>
        </div>
      </div>
    </section>
  </main>
