  <script src="../js/shell-header-pt.min.js?v=1795809715" defer></script><main id="main" tabindex="-1">
    <section class="content mi-turno-page">
      <div class="container">
        <div class="mi-turno-layout">
          <p class="mi-turno-eyebrow">Gestão de horários</p>
          <h1>Consultar ou cancelar seu horário</h1>
          <p class="mi-turno-lead">Informe o sobrenome do paciente, o e-mail da reserva e o código enviado na confirmação.</p>

          <form id="mi-turno-form" class="mi-turno-form" novalidate>
            <div class="mi-turno-field">
              <label for="mt-apellido">Sobrenome</label>
              <input id="mt-apellido" name="apellido" type="text" autocomplete="family-name" maxlength="80" required placeholder="ex. Pérez" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-email">E-mail</label>
              <input id="mt-email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="ex. juan@exemplo.com" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-codigo">Código de gestão <span class="mi-turno-field-note">Está no e-mail de confirmação que você recebeu.</span></label>
              <input id="mt-codigo" name="codigo" type="text" autocomplete="one-time-code" maxlength="12" required placeholder="ex. AB3K7MP" spellcheck="false" autocapitalize="characters" />
            </div>
            <button type="submit" class="mi-turno-btn" id="mt-submit">Buscar horário</button>
          </form>

          <p class="mi-turno-hint">O código está no e-mail de confirmação da reserva. Você também pode gerenciar o horário com a Clara no WhatsApp.</p>
          <div id="mt-status" class="mi-turno-status" role="status" aria-live="polite" hidden></div>
          <div id="mt-result" class="mi-turno-result" hidden></div>
        </div>
      </div>
    </section>
