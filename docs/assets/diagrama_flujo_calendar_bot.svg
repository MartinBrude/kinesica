<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0B1E16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16382C"/>
      <stop offset="100%" stop-color="#0F281E"/>
    </linearGradient>
    <linearGradient id="gradHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#74C69D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="42" text-anchor="middle" fill="#D8F3DC" font-size="24" font-weight="700" letter-spacing="0.5">⚙️ ¿CÓMO FUNCIONA GOOGLE CALENDAR POR DETRÁS EN KINÉSICA?</text>
  <text x="480" y="68" text-anchor="middle" fill="#95D5B2" font-size="14">El Calendario 'consultorio' es la fuente única y absoluta de verdad de todo el ecosistema</text>

  <!-- Step 1: Kinesiólogos y Web -->
  <g transform="translate(40, 100)">
    <rect width="240" height="330" rx="16" fill="url(#gradCard)" stroke="#2D6A4F" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="44" rx="16" fill="#1B4332"/>
    <text x="120" y="28" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">1. Agendamiento</text>
    
    <!-- Sub item A -->
    <rect x="15" y="58" width="210" height="75" rx="10" fill="#0F251C" stroke="#40916C" stroke-width="1"/>
    <text x="25" y="80" fill="#52B788" font-size="13" font-weight="700">👨‍⚕️ Norberto y María</text>
    <text x="25" y="100" fill="#D8F3DC" font-size="11">Cargan turnos a mano o</text>
    <text x="25" y="116" fill="#D8F3DC" font-size="11">bloquean horarios personales.</text>

    <!-- Sub item B -->
    <rect x="15" y="145" width="210" height="75" rx="10" fill="#0F251C" stroke="#40916C" stroke-width="1"/>
    <text x="25" y="167" fill="#52B788" font-size="13" font-weight="700">🤖 Clara (WhatsApp)</text>
    <text x="25" y="187" fill="#D8F3DC" font-size="11">Crea turnos de pacientes</text>
    <text x="25" y="203" fill="#D8F3DC" font-size="11">que reservan por chat 24/7.</text>

    <!-- Sub item C -->
    <rect x="15" y="232" width="210" height="75" rx="10" fill="#0F251C" stroke="#40916C" stroke-width="1"/>
    <text x="25" y="254" fill="#52B788" font-size="13" font-weight="700">🌐 Web kinesica.com.ar</text>
    <text x="25" y="274" fill="#D8F3DC" font-size="11">Inserta reservas online</text>
    <text x="25" y="290" fill="#D8F3DC" font-size="11">con datos completos y DNI.</text>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <path d="M 290 265 L 345 265" stroke="#52B788" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <polygon points="355,265 343,259 343,271" fill="#52B788"/>

  <!-- Step 2: Google Calendar (El Núcleo Central) -->
  <g transform="translate(360, 95)">
    <rect width="240" height="340" rx="18" fill="#112E22" stroke="#52B788" stroke-width="2.5" filter="url(#glow)"/>
    <rect width="240" height="340" rx="18" fill="#112E22" stroke="#52B788" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="48" rx="18" fill="#2D6A4F"/>
    <text x="120" y="30" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">📅 Google Calendar</text>
    <text x="120" y="72" text-anchor="middle" fill="#74C69D" font-size="12" font-weight="700">Calendario: 'consultorio'</text>

    <!-- Calendar event mockup inside -->
    <rect x="15" y="88" width="210" height="125" rx="10" fill="#0B2017" stroke="#52B788" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="22" y="96" width="196" height="24" rx="4" fill="#1B4332"/>
    <text x="28" y="112" fill="#FFFFFF" font-size="11" font-weight="700">🩺 [TURNO] Lucas Méndez</text>
    <text x="28" y="134" fill="#95D5B2" font-size="10">🕒 10:00 - 11:00 hs (1h)</text>
    <text x="28" y="150" fill="#D8F3DC" font-size="10">📱 WhatsApp: 5491144556677</text>
    <text x="28" y="166" fill="#D8F3DC" font-size="10">🪪 DNI: 35123456</text>
    <text x="28" y="182" fill="#74C69D" font-size="9">🟢 1 sola camilla física activa</text>

    <!-- Behind the scenes rules -->
    <rect x="15" y="225" width="210" height="95" rx="10" fill="#183B2D"/>
    <text x="25" y="245" fill="#D8F3DC" font-size="11" font-weight="700">🛡️ Filtros de Clara:</text>
    <text x="25" y="263" fill="#B7E4C7" font-size="10">• Lee huecos libres (08 a 19:30 hs)</text>
    <text x="25" y="279" fill="#B7E4C7" font-size="10">• Hold 10 min anti-colisión</text>
    <text x="25" y="295" fill="#B7E4C7" font-size="10">• Ignora bloqueos y vacaciones</text>
    <text x="25" y="311" fill="#B7E4C7" font-size="10">• Solo lee 'consultorio'</text>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <path d="M 610 265 L 665 265" stroke="#52B788" stroke-width="3" fill="none"/>
  <polygon points="675,265 663,259 663,271" fill="#52B788"/>

  <!-- Step 3: Bot de Recordatorios & WhatsApp -->
  <g transform="translate(680, 100)">
    <rect width="240" height="330" rx="16" fill="url(#gradCard)" stroke="#2D6A4F" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="44" rx="16" fill="#1B4332"/>
    <text x="120" y="28" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">3. Recordatorio 24h</text>

    <!-- Sub item A: Cron -->
    <rect x="15" y="58" width="210" height="80" rx="10" fill="#0F251C" stroke="#40916C" stroke-width="1"/>
    <text x="25" y="78" fill="#52B788" font-size="12" font-weight="700">⏰ Disparo Automático</text>
    <text x="25" y="96" fill="#D8F3DC" font-size="11">Lun a Jue 10:00 hs</text>
    <text x="25" y="112" fill="#D8F3DC" font-size="11">Domingos 18:00 hs (turnos lun)</text>
    <text x="25" y="128" fill="#95D5B2" font-size="10">Extrae WhatsApp y nombre</text>

    <!-- Sub item B: Botones -->
    <rect x="15" y="150" width="210" height="85" rx="10" fill="#0F251C" stroke="#40916C" stroke-width="1"/>
    <text x="25" y="172" fill="#52B788" font-size="12" font-weight="700">📲 WhatsApp con 2 Botones</text>
    <text x="26" y="196" fill="#74C69D" font-size="10">[✅ Confirmo] ➔ Auto-marca Calendar</text>
    <text x="26" y="218" fill="#FF6B6B" font-size="10">[❌ Cancelar] ➔ Libera y avisa lista</text>

    <!-- Sub item C: Impacto Calendar -->
    <rect x="15" y="247" width="210" height="65" rx="10" fill="#1B4332"/>
    <text x="25" y="268" fill="#FFFFFF" font-size="11" font-weight="700">🔄 Auto-Impacto en Calendar:</text>
    <text x="25" y="286" fill="#D8F3DC" font-size="10">Al tocar confirmar, el título pasa a:</text>
    <text x="25" y="302" fill="#52B788" font-size="10" font-weight="700">🩺 [CONFIRMADO] Lucas Méndez</text>
  </g>
</svg>