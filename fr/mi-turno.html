  <script src="../js/shell-header-fr.min.js?v=1794821184" defer></script><main id="main" tabindex="-1">
    <section class="content mi-turno-page">
      <div class="container">
        <div class="mi-turno-layout">
          <p class="mi-turno-eyebrow">Gestion des rendez-vous</p>
          <h1>Consulter ou annuler votre rendez-vous</h1>
          <p class="mi-turno-lead">Indiquez le nom du patient, l’e-mail utilisé pour la réservation et le code reçu dans la confirmation.</p>

          <form id="mi-turno-form" class="mi-turno-form" novalidate>
            <div class="mi-turno-field">
              <label for="mt-apellido">Nom de famille</label>
              <input id="mt-apellido" name="apellido" type="text" autocomplete="family-name" maxlength="80" required placeholder="ex. Pérez" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-email">E-mail</label>
              <input id="mt-email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="ex. juan@exemple.com" />
            </div>
            <div class="mi-turno-field">
              <label for="mt-codigo">Code de gestion</label>
              <input id="mt-codigo" name="codigo" type="text" autocomplete="one-time-code" maxlength="12" required placeholder="ex. AB3K7MP" spellcheck="false" autocapitalize="characters" />
            </div>
            <button type="submit" class="mi-turno-btn" id="mt-submit">Rechercher</button>
          </form>

          <p class="mi-turno-hint">Le code figure dans l’e-mail de confirmation. Vous pouvez aussi gérer le rendez-vous avec Clara sur WhatsApp.</p>
          <div id="mt-status" class="mi-turno-status" role="status" aria-live="polite" hidden></div>
          <div id="mt-result" class="mi-turno-result" hidden></div>
        </div>
      </div>
    </section>
  </main>
