          <h1>Consulter ou annuler votre rendez-vous</h1>
          <p class="mi-turno-lead">Indiquez le nom du patient, l’e-mail utilisé pour la réservation et le code reçu dans la confirmation.</p>

          <form id="mi-turno-form" class="mi-turno-form" novalidate>

              <input id="mt-email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="ex. juan@exemple.com" />

            <button type="submit" class="mi-turno-btn" id="mt-submit">Rechercher</button>
          </form>

          <p class="mi-turno-hint">Le code figure dans l’e-mail de confirmation. Vous pouvez aussi gérer le rendez-vous avec Clara sur WhatsApp.</p>

        </div>
