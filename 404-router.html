  <script src="js/lang-routes.min.js?v=1791042362"></script>
  <script src="js/lang-preference.min.js?v=1791042362" defer></script>
  <script>
    (function () {
      var routes = window.KINESICA_LANG_ROUTES;
      var path = (window.location.pathname || "").toLowerCase();
      var pref =
        typeof window.kinesicaGetLangPreference === "function"
          ? window.kinesicaGetLangPreference()
          : (function () {
              try { return localStorage.getItem("kinesica_lang"); } catch (e) { return null; }
            })();
      var nav = (navigator.language || navigator.userLanguage || "").toLowerCase();
      var lang = "es";

      // 1. Inspect URL pathname first
      if (path.indexOf("/pt/") === 0 || path === "/pt") {
        lang = "pt";
      } else if (path.indexOf("/fr/") === 0 || path === "/fr") {
        lang = "fr";
      } else if (path.indexOf("/en/") === 0 || path === "/en") {
        lang = "en";
      // 2. Saved user preference
      } else if (pref === "en" || pref === "fr" || pref === "pt" || pref === "es") {
        lang = pref;
      // 3. Browser language
      } else if (nav.indexOf("pt") === 0) {
        lang = "pt";
      } else if (nav.indexOf("fr") === 0) {
        lang = "fr";
      } else if (nav.indexOf("en") === 0) {
        lang = "en";
      }

      var target;
      if (routes && routes.isFileProtocol && routes.isFileProtocol()) {
        target =
          lang === "fr"
            ? "fr/404.html"
            : lang === "en"
              ? "en/404.html"
              : lang === "pt"
                ? "pt/404.html"
                : "404.html";
      } else {
        target =
          lang === "fr"
            ? "/fr/404.html"
            : lang === "en"
              ? "/en/404.html"
              : lang === "pt"
                ? "/pt/404.html"
                : "/404.html";
      }
      window.location.replace(target);
    })();
  </script>
